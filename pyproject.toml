[project]
name = "herald"
version = "0.1.0"
description = "Publish upcoming events from your `.ics` calendar to WhatsApp, Mastodon, and other platforms."
readme = "README.md"
authors = [
    { name = "Moritz Duchêne", email = "git@mrtz.me" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
    "icalendar>=6.0.0",
    "recurring-ical-events>=3.0.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.0",
    "babel>=2.16.0",
    "mastodon-py>=2.1.4",
    "python-telegram-bot>=22.6",
]

[project.scripts]
herald = "herald.cli:app"

[build-system]
requires = ["uv_build>=0.9.29,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "freezegun>=1.0.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.15.0",
    "pre-commit>=4.5.1",
]
